<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>ניהול מחירים – בית חב״ד כפר רתמים</title>
  <style>
    :root {
      --bg: #0b0f19;
      --surface: #0f1526;
      --surface2: #121a33;
      --text: #f1f5f9;
      --muted: #a5afc9;
      --gold1: #f7e7a1;
      --gold2: #e6c45d;
      --gold3: #b8912f;
      --line: rgba(255,255,255,.1);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      padding-bottom: 120px;
    }
    .wrap { max-width: 960px; margin: 0 auto; }
    header.top {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 22px; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .card {
      background: linear-gradient(180deg, var(--surface), var(--surface2));
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .card h3 { margin: 0 0 6px; font-size: 18px; }
    .preview-price {
      display: inline-block;
      margin: 8px 0 14px;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 14px;
      color: #0b0f19;
      background: linear-gradient(135deg, var(--gold1), var(--gold2), var(--gold3));
    }
    label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.28);
      color: var(--text);
      font-size: 15px;
    }
    textarea { min-height: 72px; resize: vertical; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    .actions {
      display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px;
    }
    button {
      padding: 14px 18px;
      border-radius: 14px;
      border: none;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
    }
    .primary { background: linear-gradient(135deg, var(--gold1), var(--gold2), var(--gold3)); color: #0b0f19; }
    .publish { background: linear-gradient(135deg, #2d8f5f, #1f6b45); color: #fff; }
    .secondary { background: rgba(255,255,255,.08); color: var(--text); border: 1px solid var(--line); }
    #loginBox, #app { display: none; }
    #loginBox.show, #app.show { display: block; }
    .msg {
      margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 14px;
      display: none; line-height: 1.5;
    }
    .msg.show { display: block; }
    .msg.ok { background: rgba(31,107,69,.3); border: 1px solid rgba(45,143,95,.5); }
    .msg.err { background: rgba(122,51,51,.35); border: 1px solid rgba(180,80,80,.5); }
    .bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(11,15,25,.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--line);
      padding: 12px 16px;
      z-index: 50;
    }
    .bar-inner {
      max-width: 960px; margin: 0 auto;
      display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between;
    }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.6; margin-top: 10px; }
    code { background: rgba(0,0,0,.35); padding: 2px 6px; border-radius: 6px; }
    a { color: var(--gold2); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <h1>ניהול תשמישי קדושה</h1>
        <div class="sub">כתובת סודית · לא מוצג ללקוחות · מתעדכן גם באפליקציית האייפון</div>
      </div>
    </header>

    <div id="loginBox" class="card">
      <h3>כניסת מנהל</h3>
      <label>סיסמה</label>
      <input id="password" type="password" placeholder="סיסמת מנהל" autocomplete="current-password" />
      <div class="actions">
        <button class="primary" id="loginBtn" type="button">כניסה</button>
      </div>
    </div>

    <div id="app">
      <div class="card">
        <h3>חיבור פרסום (פעם אחת)</h3>
        <label>GitHub Personal Access Token</label>
        <input id="token" type="password" placeholder="ghp_..." autocomplete="off" />
        <div class="actions">
          <button class="secondary" id="saveTokenBtn" type="button">שמור טוקן במכשיר</button>
          <button class="secondary" id="clearTokenBtn" type="button">מחק טוקן</button>
        </div>
        <div class="hint">
          GitHub → Settings → Developer settings → Personal access tokens → Tokens (classic) →
          Generate new token · סמן <code>repo</code> → העתק לכאן.
          הטוקן נשמר רק במכשיר שלך.
        </div>
      </div>

      <div class="grid" id="fields"></div>

      <div class="msg" id="msg"></div>
    </div>
  </div>

  <div class="bar" id="bar" style="display:none">
    <div class="bar-inner">
      <div class="sub" id="statusLine">מוכן לעריכה</div>
      <div class="actions" style="margin:0">
        <button class="secondary" id="reloadBtn" type="button">רענן</button>
        <button class="secondary" id="downloadBtn" type="button">גיבוי</button>
        <button class="publish" id="publishBtn" type="button">פרסם לאתר עכשיו</button>
      </div>
    </div>
  </div>

  <script>
    var PASS = "chabad770";
    var REPO_OWNER = "EFI770";
    var REPO_NAME = "chabad-kodesh";
    var FILE_PATH = "prices.json";
    var ORDER = ["tefillin", "mezuzah", "tallit", "barMitzvah"];

    var loginBox = document.getElementById("loginBox");
    var app = document.getElementById("app");
    var fields = document.getElementById("fields");
    var msg = document.getElementById("msg");
    var tokenInput = document.getElementById("token");
    var bar = document.getElementById("bar");
    var statusLine = document.getElementById("statusLine");
    var data = null;

    function showMsg(text, ok) {
      msg.textContent = text;
      msg.className = "msg show " + (ok ? "ok" : "err");
      statusLine.textContent = text;
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, "&")
        .replace(/</g, "<")
        .replace(/"/g, """);
    }

    function getToken() {
      return localStorage.getItem("chabad_gh_token") || "";
    }

    function render() {
      fields.innerHTML = "";
      ORDER.forEach(function (key) {
        var it = data.items[key];
        if (!it) return;
        var card = document.createElement("div");
        card.className = "card";
        card.innerHTML =
          "<h3>" + esc(it.title) + "</h3>" +
          "<div class=\"preview-price\" data-preview=\"" + key + "\">" + esc(it.price) + "</div>" +
          "<label>כותרת (כמו באתר)</label>" +
          "<input data-key=\"" + key + "\" data-field=\"title\" value=\"" + esc(it.title) + "\" />" +
          "<label>תיאור</label>" +
          "<textarea data-key=\"" + key + "\" data-field=\"desc\">" + esc(it.desc) + "</textarea>" +
          "<label>מחיר שמוצג באתר</label>" +
          "<input data-key=\"" + key + "\" data-field=\"price\" value=\"" + esc(it.price) + "\" />" +
          "<label>טקסט הודעת וואטסאפ</label>" +
          "<input data-key=\"" + key + "\" data-field=\"waText\" value=\"" + esc(it.waText) + "\" />";
        fields.appendChild(card);
      });

      fields.querySelectorAll('input[data-field="price"]').forEach(function (inp) {
        inp.addEventListener("input", function () {
          var key = inp.getAttribute("data-key");
          var prev = fields.querySelector('[data-preview="' + key + '"]');
          if (prev) prev.textContent = inp.value || "—";
        });
      });
      fields.querySelectorAll('input[data-field="title"]').forEach(function (inp) {
        inp.addEventListener("input", function () {
          var card = inp.closest(".card");
          if (card) {
            var h = card.querySelector("h3");
            if (h) h.textContent = inp.value || "";
          }
        });
      });
    }

    function collect() {
      fields.querySelectorAll("[data-key]").forEach(function (el) {
        var key = el.getAttribute("data-key");
        var field = el.getAttribute("data-field");
        data.items[key][field] = el.value.trim();
      });
      data.updatedAt = new Date().toISOString().slice(0, 10);
    }

    async function loadPrices() {
      var res = await fetch("./prices.json?ts=" + Date.now(), { cache: "no-store" });
      data = await res.json();
      render();
      showMsg("נטען מהאתר · עודכן לאחרונה: " + (data.updatedAt || "—"), true);
    }

    function toBase64Unicode(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }

    async function publishToGitHub() {
      var token = getToken();
      if (!token) {
        showMsg("אין טוקן שמור. הדבק GitHub Token למעלה ולחץ שמור.", false);
        return;
      }
      collect();
      var bodyText = JSON.stringify(data, null, 2) + "\n";
      showMsg("מפרסם לאתר...", true);

      var metaRes = await fetch(
        "https://api.github.com/repos/" + REPO_OWNER + "/" + REPO_NAME + "/contents/" + FILE_PATH,
        { headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + token } }
      );
      if (!metaRes.ok) {
        showMsg("שגיאה בגיטהאב (" + metaRes.status + "). בדוק שהטוקן כולל הרשאת repo.", false);
        return;
      }
      var meta = await metaRes.json();

      var putRes = await fetch(
        "https://api.github.com/repos/" + REPO_OWNER + "/" + REPO_NAME + "/contents/" + FILE_PATH,
        {
          method: "PUT",
          headers: {
            Accept: "application/vnd.github+json",
            Authorization: "Bearer " + token,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "עדכון מחירים " + data.updatedAt,
            content: toBase64Unicode(bodyText),
            sha: meta.sha,
            branch: "main"
          })
        }
      );

      if (!putRes.ok) {
        var errText = await putRes.text();
        showMsg("פרסום נכשל (" + putRes.status + ").", false);
        console.log(errText);
        return;
      }
      showMsg("פורסם בהצלחה. תוך כדקה זה יתעדכן באתר ובאפליקציה.", true);
    }

    function enterApp() {
      loginBox.classList.remove("show");
      app.classList.add("show");
      bar.style.display = "block";
      tokenInput.value = getToken();
      loadPrices();
    }

    document.getElementById("loginBtn").onclick = function () {
      if (document.getElementById("password").value === PASS) {
        sessionStorage.setItem("chabad_admin", "1");
        enterApp();
      } else {
        alert("סיסמה שגויה");
      }
    };
    document.getElementById("password").addEventListener("keydown", function (e) {
      if (e.key === "Enter") document.getElementById("loginBtn").click();
    });

    document.getElementById("saveTokenBtn").onclick = function () {
      var t = tokenInput.value.trim();
      if (!t) return showMsg("הכנס טוקן קודם.", false);
      localStorage.setItem("chabad_gh_token", t);
      showMsg("הטוקן נשמר במכשיר.", true);
    };
    document.getElementById("clearTokenBtn").onclick = function () {
      localStorage.removeItem("chabad_gh_token");
      tokenInput.value = "";
      showMsg("הטוקן נמחק.", true);
    };
    document.getElementById("publishBtn").onclick = publishToGitHub;
    document.getElementById("reloadBtn").onclick = loadPrices;
    document.getElementById("downloadBtn").onclick = function () {
      collect();
      var blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "prices.json";
      a.click();
      URL.revokeObjectURL(a.href);
      showMsg("גיבוי ירד.", true);
    };

    if (sessionStorage.getItem("chabad_admin") === "1") enterApp();
    else loginBox.classList.add("show");
  </script>
</body>
</html>
